"ANOTHER","level":"12","clearType":"E-CLEAR","djLevel":"A","score":"2490","missCount":"49","notes":"1601","useOption":"R-RANDOM","pgreat":"1047","great":"396","good":"127","bad":"15","poor":"34","fast":"297","slow":"226","comboBreak":"31"},{"dateTime":"2024-03-24 23:34","title":"AA","artist":"D.J.Amuro","difficulty":"ANOTHER","level":"12","clearType":"H-CLEAR","djLevel":"A","score":"2625","missCount":"61","notes":"1834","useOption":"RANDOM","pgreat":"1087","great":"451","good":"253","bad":"10","poor":"51","fast":"206","slow":"498","comboBreak":"43"}];
const pageSize = 50;
let filteredRows = allRows;
let currentPage = 0;

function applyFilter() {
  const title = document.getElementById('fTitle').value.trim().toLowerCase();
  const artist = document.getElementById('fArtist').value.trim().toLowerCase();
  const difficulty = document.getElementById('fDifficulty').value;
  filteredRows = allRows.filter(r =>
    (title === '' || r.title.toLowerCase().includes(title)) &&
    (artist === '' || r.artist.toLowerCase().includes(artist)) &&
    (difficulty === '' || r.difficulty === difficulty)
  );
  currentPage = 0;
  render();
}

function render() {
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  const start = currentPage * pageSize;
  const pageRows = filteredRows.slice(start, start + pageSize);

  const tbody = document.getElementById('logBody');
  tbody.innerHTML = '';
  const cols = ['dateTime','title','artist','difficulty','level','clearType','djLevel','score','missCount','notes','useOption'];
  const colLabels = ['日時','曲名','アーティスト','難易度','Lv','CLEAR TYPE','DJ LEVEL','SCORE','MISS COUNT','NOTES数','USE OPTION'];
  let openTr = null;
  let openToggleTd = null;

  function collapseOpen() {
    if (openTr) {
      const detail = openTr.nextSibling;
      if (detail && detail.classList.contains('detail-row')) detail.remove();
    }
    if (openToggleTd) openToggleTd.textContent = '▼';
    openTr = null;
    openToggleTd = null;
  }

  function toggleDetail(tr, toggleTd, row) {
    if (openTr === tr) { collapseOpen(); return; }
    collapseOpen();
    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    const td = document.createElement('td');
    td.colSpan = cols.length + 1;
    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    const items = [
      ['PGREAT', row.pgreat], ['GREAT', row.great], ['GOOD', row.good],
      ['BAD', row.bad], ['POOR', row.poor],
      ['FAST', row.fast], ['SLOW', row.slow], ['COMBO BREAK', row.comboBreak]
    ];
    items.forEach(([label, value]) => {
      const item = document.createElement('div');
      item.className = 'detail-item';
      const lbl = document.createElement('span');
      lbl.className = 'detail-label';
      lbl.textContent = label + ':';
      const val = document.createElement('span');
      val.textContent = value;
      item.appendChild(lbl);
      item.appendChild(val);
      grid.appendChild(item);
    });
    td.appendChild(grid);
    detailTr.appendChild(td);
    tr.parentNode.insertBefore(detailTr, tr.nextSibling);
    toggleTd.textContent = '▲';
    openTr = tr;
    openToggleTd = toggleTd;
  }

  for (const row of pageRows) {
    const tr = document.createElement('tr');
    cols.forEach((col, i) => {
      const td = document.createElement('td');
      td.textContent = row[col];
      td.setAttribute('data-label', colLabels[i]);
      tr.appendChild(td);
    });
    const toggleTd = document.createElement('td');
    toggleTd.className = 'toggle-td';
    toggleTd.textContent = '▼';
    toggleTd.addEventListener('click', () => toggleDetail(tr, toggleTd, row));
    tr.appendChild(toggleTd);
    tbody.appendChild(tr);
  }

  document.getElementById('countLabel').textContent =
    filteredRows.length + ' 件 (全' + allRows.length + '件中)';
  document.getElementById('pageLabel').textContent =
    (filteredRows.length === 0 ? 0 : currentPage + 1) + ' / ' + totalPages + ' ページ';
  document.getElementById('prevBtn').disabled = currentPage <= 0;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
}

document.getElementById('fTitle').addEventListener('input', applyFilter);
document.getElementById('fArtist').addEventListener('input', applyFilter);
document.getElementById('fDifficulty').addEventListener('change', applyFilter);
document.getElementById('fClear').addEventListener('click', () => {
  document.getElementById('fTitle').value = '';
  document.getElementById('fArtist').value = '';
  document.getElementById('fDifficulty').value = '';
  applyFilter();
});
document.getElementById('prevBtn').addEventListener('click', () => { currentPage--; render(); });
document.getElementById('nextBtn').addEventListener('click', () => { currentPage++; render(); });

render();
</script>
